name: Validate SmartBuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SmartBuild current version
        run: node scripts/validate-smartbuild.mjs

      - name: Run SmartBuild functional policy tests
        run: node scripts/test-auto-dev-functional.mjs

      - name: Run SmartBuild offline behavior contracts
        run: node scripts/test-auto-dev-behavior.mjs --self-test

      - name: Check README marker is stable
        run: |
          node scripts/ensure-smartbuild-readme.mjs
          git diff --exit-code -- README.md
