name: Validate SmartBuild

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run task runtime scenarios
        run: node --test scripts/test-task-runtime.mjs scripts/test-skill-library.mjs scripts/test-skill-router.mjs scripts/test-workflow-audit.mjs scripts/test-panel.mjs scripts/test-audit-regressions.mjs scripts/test-workflow-contract.mjs scripts/test-doctor.mjs skills/auto-dev/scripts/workflow-contract.test.mjs skills/auto-dev/scripts/quality-policy.test.mjs

      - name: Validate SmartBuild current version
        run: node scripts/validate-smartbuild.mjs

      - name: Run SmartBuild functional policy tests
        run: node scripts/test-auto-dev-functional.mjs

      - name: Run SmartBuild offline behavior contracts
        run: node scripts/test-auto-dev-behavior.mjs --self-test

      - name: Check README marker is stable
        run: |
          node scripts/ensure-smartbuild-readme.mjs
          git diff --exit-code -- README.md

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify runtime and skill library on Windows
        run: node --test scripts/test-task-runtime.mjs scripts/test-skill-library.mjs scripts/test-skill-router.mjs scripts/test-workflow-audit.mjs scripts/test-panel.mjs scripts/test-audit-regressions.mjs scripts/test-workflow-contract.mjs scripts/test-doctor.mjs skills/auto-dev/scripts/workflow-contract.test.mjs skills/auto-dev/scripts/quality-policy.test.mjs
      - name: Verify installed skills and backup behavior
        shell: pwsh
        run: ./scripts/test-install-smartbuild.ps1

      - name: Verify interrupted installation and recovery
        shell: pwsh
        run: |
          ./scripts/test-install-recovery.ps1
          node --test scripts/test-install-recovery.mjs
      - name: Verify Windows PowerShell 5.1 recovery compatibility
        shell: powershell
        run: |
          ./scripts/test-install-recovery.ps1
          $env:SMARTBUILD_PWSH = 'powershell.exe'
          node --test scripts/test-install-recovery.mjs
