interface:
  display_name: "智构开发系统"
  short_description: "一个人的AI开发工作台：自由创作、正规化、真实测试交付。"
  default_prompt: "使用 $auto-dev：自动识别普通问答、记录想法和明确开发动作，不要求用户切换模式。先判断目标项目和意图；用户直接说“开发助手”即开启持续单面板，直到明确说“关闭开发助手”；问答、暂停及讨论本工具都保持完整面板，引用里的词不触发操作。普通问题先回答，下方可显示已有任务；开启时每次回复使用第一版紧凑面板：固定五部目录单行、当前阶段单行、下方直接显示照片式五列任务表（顺序、状态、编号、所属步骤、完成内容）。任务锁、阶段和断点跨话题保留，第二阶段后不因新需求自动退回第一阶段。开发前先排队并显示入口表；单窗口运行，自动择优技能，禁止假数据、假接口和假测试。"
policy:
  allow_implicit_invocation: true
